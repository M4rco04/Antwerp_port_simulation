<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulation viewer · __RUN__</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface-1: #fcfcfb; --text-primary: #0b0b0b; --text-secondary: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,0.10);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4;
  --accent-wash: rgba(42,120,214,0.10);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface-1: #1a1a19; --text-primary: #f0efec; --text-secondary: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
    --accent-wash: rgba(57,135,229,0.16);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface-1: #1a1a19; --text-primary: #f0efec; --text-secondary: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
  --accent-wash: rgba(57,135,229,0.16);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--page); color: var(--text-primary); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 10px 16px; border-bottom: 1px solid var(--ring); background: var(--surface-1); }
header h1 { font-size: 16px; margin: 0; font-weight: 600; }
header h1 small { font-weight: 400; color: var(--text-secondary); }
.tabs { display: flex; gap: 4px; }
.tabs button, .btn { border: 1px solid var(--ring); background: var(--surface-1); color: var(--text-primary); border-radius: 8px; padding: 6px 12px; font: inherit; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--accent-wash); border-color: var(--s1); font-weight: 600; }
.btn:hover, .tabs button:hover { background: var(--accent-wash); }
.player { display: flex; align-items: center; gap: 10px; flex: 1 1 420px; min-width: 0; }
.player input[type=range] { flex: 1; min-width: 80px; accent-color: var(--s1); }
.player .clock { font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--text-secondary); min-width: 150px; }
select { font: inherit; color: var(--text-primary); background: var(--surface-1); border: 1px solid var(--ring); border-radius: 8px; padding: 5px 8px; }
main { height: calc(100% - 58px); }
.view { display: none; height: 100%; }
.view.on { display: flex; }
#live { gap: 0; }
#mapwrap { position: relative; flex: 1 1 auto; min-width: 0; }
#map { position: absolute; inset: 0; background: var(--page); }
#mesh, #shipcanvas { position: absolute; inset: 0; pointer-events: none; z-index: 450; }
#mesh { z-index: 440; }
#depthcanvas { position: absolute; inset: 0; pointer-events: none; z-index: 445; opacity: 0.8; }
.ramp { display: flex; margin: 4px 0 2px; }
.ramp span { flex: 1; height: 10px; }
.ramp span + span { margin-left: 2px; }
.rampl { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-secondary); }
.maptools select { width: 100%; margin-top: 2px; }
.maptools { position: absolute; top: 10px; right: 10px; z-index: 600; background: var(--surface-1); border: 1px solid var(--ring); border-radius: 8px; padding: 8px 10px; font-size: 13px; max-width: 220px; }
.maptools label { display: block; margin: 2px 0; cursor: pointer; }
.maptools .h { font-weight: 600; margin: 6px 0 2px; }
.maptools .h:first-child { margin-top: 0; }
.legend { position: absolute; left: 10px; bottom: 22px; z-index: 600; background: var(--surface-1); border: 1px solid var(--ring); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
.legend .row { display: flex; align-items: center; gap: 8px; margin: 2px 0; color: var(--text-primary); }
.sw { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.legend .note { color: var(--text-secondary); font-size: 12px; margin-top: 4px; }
#tip { position: absolute; z-index: 700; pointer-events: none; background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--ring); border-radius: 8px; padding: 6px 8px; font-size: 12px; display: none; box-shadow: 0 2px 8px rgba(0,0,0,0.12); white-space: nowrap; }
aside { width: 440px; flex: none; overflow-y: auto; border-left: 1px solid var(--ring); background: var(--page); padding: 12px 16px 24px; }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
.kpi { background: var(--surface-1); border: 1px solid var(--ring); border-radius: 8px; padding: 8px 10px; }
.kpi .v { font-size: 20px; font-weight: 600; }
.kpi .l { font-size: 12px; color: var(--text-secondary); }
.card { background: var(--surface-1); border: 1px solid var(--ring); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
.card h2 { font-size: 14px; margin: 0 0 2px; font-weight: 600; }
.card .sub { font-size: 12px; color: var(--text-secondary); margin: 0 0 8px; }
.chartbox { position: relative; height: 170px; }
.chartbox.tall { height: 260px; }
.chartbox.xtall { height: 340px; }
#shipcard .attrs { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 13px; margin: 8px 0; }
#shipcard .attrs div:nth-child(odd) { color: var(--text-secondary); }
.timeline { display: flex; height: 14px; border-radius: 4px; overflow: hidden; margin: 6px 0 2px; background: var(--grid); }
.timeline div { height: 100%; border-right: 2px solid var(--surface-1); }
.tlaxis { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
.evlist { max-height: 280px; overflow-y: auto; font-size: 12px; border-top: 1px solid var(--grid); margin-top: 8px; }
.evlist div { padding: 3px 0; border-bottom: 1px solid var(--grid); cursor: pointer; }
.evlist div:hover { background: var(--accent-wash); }
.evlist b { font-weight: 600; }
.evlist .t { color: var(--text-secondary); font-variant-numeric: tabular-nums; margin-right: 6px; }
.empty { color: var(--text-secondary); font-size: 13px; }
.agrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 12px; max-width: 1500px; }
.agrid .wide { grid-column: 1 / -1; }
.akpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-bottom: 12px; max-width: 1500px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th { color: var(--text-secondary); font-weight: 600; cursor: pointer; position: sticky; top: 0; background: var(--surface-1); }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--accent-wash); }
.tablewrap { max-height: 520px; overflow: auto; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
.filters input[type=search] { font: inherit; padding: 5px 8px; border: 1px solid var(--ring); border-radius: 8px; background: var(--surface-1); color: var(--text-primary); min-width: 200px; }
.leaflet-container { font: inherit; }
.leaflet-tooltip { font-size: 12px; }
#live aside[hidden] { display: none; }
/* the statistics window */
body.statswin { height: auto; min-height: 100%; }
.statswin header { position: sticky; top: 0; z-index: 10; }
.spage { display: none; padding: 16px; }
.spage.on { display: block; }
.kpis.k8 { grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); max-width: 1500px; }
.ptable td { white-space: normal; vertical-align: top; }
.ptable td div + div { margin-top: 2px; }
.ptable tbody tr { cursor: default; }
.ptable tr.lockfirst td { border-top: 2px solid var(--axis); }
a.ship { color: var(--s1); text-decoration: none; font-weight: 600; cursor: pointer; }
a.ship:hover { text-decoration: underline; }
.mut { color: var(--text-secondary); font-size: 12px; }
.st { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.card h3 { font-size: 13px; margin: 12px 0 4px; font-weight: 600; }
.card h3:first-of-type { margin-top: 4px; }
.note { background: var(--accent-wash); border-radius: 8px; padding: 10px 12px; max-width: 1500px; margin-bottom: 12px; }
@media (max-width: 900px) {
  main { height: auto; }
  .view.on { display: block; }
  #mapwrap { height: 60vh; }
  aside { width: auto; border-left: 0; }
  .agrid { grid-template-columns: 1fr; }
  .kpis { grid-template-columns: repeat(2, 1fr); }
  .player .clock { min-width: 0; }
}
</style>
</head>
<body>
<header>
  <h1>Simulation viewer <small>· __RUN__</small></h1>
  <button class="btn" id="statsbtn" title="Open the locks, VTS queue, berths, charts and analysis in a separate window">Statistics ↗</button>
  <div class="player">
    <button class="btn" id="play" aria-label="Play">▶ Play</button>
    <select id="speed" aria-label="Playback speed">
      <option value="0.0833333">5 min / s</option><option value="0.5">½ h / s</option><option value="1">1 h / s</option><option value="3" selected>3 h / s</option>
      <option value="6">6 h / s</option><option value="12">12 h / s</option><option value="24">1 day / s</option>
    </select>
    <input type="range" id="slider" min="0" max="1" step="1" value="0" aria-label="Simulation time">
    <span class="clock" id="clock"></span>
  </div>
</header>
<main>
<section class="view on" id="live">
  <div id="mapwrap">
    <div id="map"></div>
    <canvas id="mesh"></canvas>
    <canvas id="depthcanvas"></canvas>
    <canvas id="shipcanvas"></canvas>
    <div id="tip"></div>
    <div class="maptools">
      <div class="h">Colour ships by</div>
      <label><input type="radio" name="colour" value="activity" checked> Activity</label>
      <label><input type="radio" name="colour" value="kind"> Kind of ship</label>
      <div class="h">Base map</div>
      <label><input type="radio" name="base" value="gray" checked> Grey map</label>
      <label><input type="radio" name="base" value="satellite"> Satellite</label>
      <label><input type="radio" name="base" value="none"> None (offline: shows the mesh)</label>
      <div class="h">Layers</div>
      <label><input type="checkbox" data-layer="fairway" checked> Buoyed fairway and lanes</label>
      <label><input type="checkbox" data-layer="anchorages" checked> Anchorages</label>
      <label><input type="checkbox" data-layer="locks" checked> Locks</label>
      <label><input type="checkbox" data-layer="terminals" checked> Container terminals</label>
      <label><input type="checkbox" data-layer="places"> Pilot stations and points</label>
      <label><input type="checkbox" data-layer="mesh"> Simulation mesh</label>
      <div class="h">Live depth</div>
      <label><input type="checkbox" id="depthon"> Water depth now</label>
      <label for="draught" style="color:var(--text-secondary)">Mark water too shallow for a draught of</label>
      <select id="draught" aria-label="Draught to check">
        <option value="0">- (off)</option><option value="6">6 m</option><option value="8">8 m</option><option value="10">10 m</option>
        <option value="12">12 m</option><option value="13.1">13.1 m (tide-dependent above)</option><option value="14.5">14.5 m</option><option value="16">16 m</option>
      </select>
      <label><input type="checkbox" id="follow"> Follow the selected ship</label>
    </div>
    <div class="legend" id="legend"></div>
  </div>
  <aside id="side" hidden>
    <div class="card" id="shipcard"></div>
  </aside>
</section>
</main>
<!-- the statistics window: written into a window of its own by openStats() -->
<template id="stats_body">
<header>
  <h1>Statistics <small>· __RUN__</small></h1>
  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-view="now">Port now</button>
    <button role="tab" aria-selected="false" data-view="charts">Charts</button>
    <button role="tab" aria-selected="false" data-view="analysis">Analysis</button>
  </div>
  <div class="player">
    <button class="btn" id="play" aria-label="Play">▶ Play</button>
    <input type="range" id="slider" min="0" max="1" step="5" value="0" aria-label="Simulation time">
    <span class="clock" id="clock"></span>
  </div>
</header>
<div class="note" id="gone" hidden style="margin:16px">The map window was closed or reloaded: open the statistics again from it.</div>
<section class="spage on" id="now">
  <div class="kpis k8" id="kpis"></div>
  <div class="note" id="noport" hidden>This run was saved before the simulation recorded the locks, the VTS queue and the berths over time. Run it again to see them here; the charts and the analysis work as before.</div>
  <div class="agrid" id="portgrid">
    <div class="card wide"><h2>VTS queue</h2><p class="sub" id="vts_sub"></p><div class="tablewrap"><table class="ptable" id="vts"></table></div></div>
    <div class="card wide"><h2>Locks</h2><p class="sub" id="locks_sub">Each chamber: what it does now, the ships in it and the ships waiting on each side, in the order they go in. Click a ship to show it on the map.</p><div class="tablewrap" style="max-height:none"><table class="ptable" id="locks"></table></div></div>
    <div class="card wide"><h2>Container terminals</h2><p class="sub" id="terms_sub">The quay each ship is given (kept from the moment it is cleared), the berth slots it covers and where the ship is now</p><div id="terms"></div></div>
    <div class="card wide"><h2>Berths</h2><p class="sub" id="berths_sub"></p>
      <div class="filters">
        <input type="search" id="bq" placeholder="Search berth, zone, ship…" aria-label="Search berths">
        <select id="bstatus" aria-label="Status"><option value="">Any ship</option><option value="coming">Ship coming</option><option value="here">Ship at the berth</option><option value="free">Free now</option></select>
      </div>
      <div class="tablewrap"><table class="ptable" id="berths"></table></div></div>
    <div class="card wide"><h2>Other ports</h2><p class="sub">Ports without a berth model (the ship stays a while, then leaves)</p><div id="ports"></div></div>
  </div>
</section>
<section class="spage" id="charts">
  <div class="agrid">
    <div class="card"><h2>Ships in the area by activity</h2><p class="sub">Click a chart to jump to that time</p><div class="chartbox"><canvas id="c_activity"></canvas></div></div>
    <div class="card"><h2>Queues</h2><p class="sub">Ships waiting for VTS clearance and ships waiting at a lock</p><div class="chartbox"><canvas id="c_queues"></canvas></div></div>
    <div class="card"><h2>Water level (m above LAT)</h2><p class="sub" id="level_sub"></p><div class="chartbox"><canvas id="c_level"></canvas></div></div>
    <div class="card"><h2>Pilots on duty</h2><div class="chartbox"><canvas id="c_pilots"></canvas></div></div>
    <div class="card"><h2>Tugs, pilot boats and boatmen in use</h2><div class="chartbox"><canvas id="c_services"></canvas></div></div>
    <div class="card"><h2>Wind force (Beaufort)</h2><div class="chartbox"><canvas id="c_wind"></canvas></div></div>
    <div class="card"><h2>Visibility (km)</h2><div class="chartbox"><canvas id="c_vis"></canvas></div></div>
  </div>
</section>
<section class="spage" id="analysis">
  <div class="akpis" id="akpis"></div>
  <div class="agrid">
    <div class="card wide"><h2>Mean time in the area by phase</h2><p class="sub" id="phase_sub"></p><div class="chartbox tall"><canvas id="c_phase"></canvas></div>
      <div class="tablewrap" style="max-height:none;margin-top:10px"><table id="phase_table"></table></div></div>
    <div class="card"><h2>Container ships: berth arrival against the schedule</h2><p class="sub" id="delay_sub"></p><div class="chartbox tall"><canvas id="c_delay"></canvas></div></div>
    <div class="card"><h2>Why ships waited for VTS clearance</h2><p class="sub">Number of holds by first failing check</p><div class="chartbox tall"><canvas id="c_hold"></canvas></div></div>
    <div class="card"><h2>Lock passages</h2><p class="sub">Ships entering a chamber, whole run</p><div class="chartbox tall"><canvas id="c_locks"></canvas></div></div>
    <div class="card"><h2>Traffic-rule and exception events</h2><p class="sub">Whole run</p><div class="chartbox tall"><canvas id="c_rules"></canvas></div></div>
    <div class="card wide"><h2>Free quay at the container terminals (m)</h2><div class="chartbox tall"><canvas id="c_quay"></canvas></div></div>
    <div class="card wide"><h2>Ships</h2>
      <div class="filters">
        <input type="search" id="q" placeholder="Search id, name, place…" aria-label="Search ships">
        <select id="fclass" aria-label="Class"><option value="">All classes</option></select>
        <select id="fstatus" aria-label="Status"><option value="">Any status</option><option>finished</option><option>in area</option><option>removed</option></select>
        <label><input type="checkbox" id="fwarm" checked> Only after warm-up</label>
        <span class="empty" id="tcount"></span>
      </div>
      <div class="tablewrap"><table id="shiptable"></table></div>
    </div>
  </div>
</section>
</template>
<script type="text/plain" id="stats_js">

</script>

<script>
"use strict";

const DARK = matchMedia("(prefers-color-scheme: dark)").matches;

function when(min) { const d = new Date(START + min * 60000); return `${DAY[d.getUTCDay()]} ${d.getUTCDate()} ${MON[d.getUTCMonth()]} ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`; }
function dayLabel(min) { const d = new Date(START + min * 60000); return `${d.getUTCDate()} ${MON[d.getUTCMonth()]}`; }
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = (v, d = 1) => v == null || Number.isNaN(v) ? "–" : Number(v).toFixed(d);
const label = s => String(s || "").replaceAll("_", " ");

    L.tileLayer(ESRI + `Canvas/World_${DARK ? "Dark" : "Light"}_Gray_Reference/MapServer/tile/{z}/{y}/{x}`, { maxZoom: 16 })]),
  satellite: L.tileLayer(ESRI + "World_Imagery/MapServer/tile/{z}/{y}/{x}",

  none: L.layerGroup(),
};
let base = bases.gray.addTo(map);
map.fitBounds([[51.2, 3.05], [51.62, 4.45]]);
const layers = {};
const lineCol = C.ink2;
layers.anchorages = L.layerGroup(D.layers.anchorages.map(a => a.poly
  ? L.polygon(a.poly, { color: C.muted, weight: 1, fillOpacity: 0.06, dashArray: "4 3" }).bindTooltip(`Anchorage ${esc(a.name)}`)
  : L.circleMarker(a.pos, { radius: 5, color: C.muted, weight: 1, fillOpacity: 0.1 }).bindTooltip(`Anchor berth ${esc(a.name)}`))).addTo(map);
layers.locks = L.layerGroup(D.layers.locks.map(l => L.circleMarker(l.pos, { radius: 6, color: lineCol, weight: 2, fillColor: C.surface, fillOpacity: 1 })
  .bindTooltip(`<b>Lock ${esc(l.name)}</b><br>${l.chambers.map(esc).join("<br>")}`))).addTo(map);
layers.terminals = L.layerGroup(D.layers.terminals.map(t => L.polyline(t.line, { color: lineCol, weight: 4, opacity: 0.8 })
  .bindTooltip(`<b>${esc(t.name)}</b>${t.sts ? `<br>${t.sts} STS cranes` : ""}`))).addTo(map);
layers.places = L.layerGroup(D.layers.places.map(p => L.circleMarker(p.pos, { radius: 3, color: C.muted, weight: 1, fillOpacity: 0.6 })
  .bindTooltip(`${esc(label(p.name))} (${esc(label(p.kind))})`)));
const BUOY = { r: "#d03b3b", g: "#0ca30c" };       // the buoys' own colours (IALA A)
{ const lanesL = D.layers.lanes || {}, items = [];
  const CH = { main: { color: C.ink2, weight: 1.2, opacity: 0.6, fillOpacity: 0.04, dashArray: null },
               side: { color: C.s[2], weight: 1.5, opacity: 0.9, fillColor: C.s[2], fillOpacity: 0.10, dashArray: "5 4" },

  document.getElementById("unsel").onclick = () => { selected = -1; if (trackLayer) map.removeLayer(trackLayer); trackLayer = null;
    showSide(false); drawShips(); };
  document.getElementById("goto").onclick = () => { seek(Math.min(start + 5, END)); const a = shipAt(i, T); if (a) map.setView([a.lat, a.lon], Math.max(map.getZoom(), 12)); else if (first) map.setView([first.lat, first.lon], Math.max(map.getZoom(), 12)); };
  drawShips();
}

// ------------------------------------------------------------------ time control
function render(force) {
  slider.value = T; document.getElementById("clock").textContent = `${when(T)} UTC · day ${fmt(T / 1440, 1)}`;
  drawDepth(force); drawShips(); notifyStats(!!force);
}
function seek(t) { T = t; render(true); }
slider.addEventListener("input", () => seek(+slider.value));
const playBtn = document.getElementById("play");
playBtn.onclick = () => { playing = !playing; playBtn.textContent = playing ? "❚❚ Pause" : "▶ Play"; playBtn.setAttribute("aria-label", playing ? "Pause" : "Play"); if (playing) { if (T >= END) T = 0; last = performance.now(); requestAnimationFrame(tick); } else notifyStats(true); };
let last = 0;
function tick(now) { if (!playing) return; const dt = (now - last) / 1000; last = now;
  T = Math.min(T + (+document.getElementById("speed").value) * 60 * dt, END);
  render(false);
  if (T >= END) { playing = false; playBtn.textContent = "▶ Play"; notifyStats(true); return; }
  requestAnimationFrame(tick); }
document.addEventListener("keydown", e => { if (e.target.tagName === "INPUT" && e.target.type !== "range") return;
  if (e.code === "Space") { e.preventDefault(); playBtn.click(); }
  if (e.code === "ArrowRight") seek(Math.min(T + 60, END)); if (e.code === "ArrowLeft") seek(Math.max(T - 60, 0)); });

// ------------------------------------------------------------------ the statistics window
// A second window (written from the template above, with its own Chart.js) shows the locks, the VTS
// queue, the berths, the charts and the analysis. It reads the data and the playhead through VIEWER.
window.VIEWER = {
  D, getT: () => T, isPlaying: () => playing, seek: t => seek(Math.min(Math.max(t, 0), END)),
  togglePlay: () => playBtn.click(),
  select(i) { selectShip(i); const a = shipAt(i, T); if (a) map.setView([a.lat, a.lon], Math.max(map.getZoom(), 12)); },
  showShip(i) { seek(Math.min(S.spawn[i] + 5, END)); this.select(i); },
};
let SW = null;
function openStats() {
  if (SW && !SW.closed && SW.statsTick) { SW.focus(); return; }
  SW = window.open("", `stats_${M.run}`, "width=1280,height=900");
  if (!SW) { alert("The browser blocked the statistics window: allow pop-ups for this page and try again."); return; }
  const d = SW.document;
  d.open();
  d.write(`<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Statistics · ${esc(M.run)}</title>${document.querySelector("style").outerHTML}
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"><\/script></head>
<body class="statswin">${document.getElementById("stats_body").innerHTML}<script>${document.getElementById("stats_js").textContent}<\/script></body></html>`);
  d.close();
}
document.getElementById("statsbtn").addEventListener("click", openStats);
function notifyStats(force) { if (SW && !SW.closed && SW.statsTick) { try { SW.statsTick(T, force); } catch (e) { console.warn(e); } } }
addEventListener("pagehide", () => { if (SW && !SW.closed) SW.close(); });

legend();
seek(Math.min(M.warmup_min, END));
</script>
</body>
</html>
